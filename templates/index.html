<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mydealz Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ---------- Dark theme (default) ---------- */
    :root {
      --bg:           #0f1117;
      --bg-card:      #1a1f2e;
      --bg-input:     #1e293b;
      --bg-input-hover: #273549;
      --border:       #2d3748;
      --border-hover: #4a5568;
      --text:         #e2e8f0;
      --text-muted:   #94a3b8;
      --text-faint:   #64748b;
      --link-hover:   #93c5fd;
      --price:        #34d399;
      --discount-bg:  #1e3a5f;
      --discount-fg:  #93c5fd;
      --tg-bg:        #1a3a2a;
      --tg-border:    #2d6a4f;
      --tg-fg:        #6ee7b7;
      --tg-hover:     #1f4a38;
      --active-bg:    #1a2a1a;
      --spinner-track:#334155;
      --spinner-head: #93c5fd;
    }

    /* ---------- Light theme ---------- */
    body.light {
      --bg:           #f1f5f9;
      --bg-card:      #ffffff;
      --bg-input:     #e2e8f0;
      --bg-input-hover: #cbd5e1;
      --border:       #cbd5e1;
      --border-hover: #94a3b8;
      --text:         #0f172a;
      --text-muted:   #475569;
      --text-faint:   #64748b;
      --link-hover:   #2563eb;
      --price:        #059669;
      --discount-bg:  #dbeafe;
      --discount-fg:  #1d4ed8;
      --tg-bg:        #dcfce7;
      --tg-border:    #86efac;
      --tg-fg:        #15803d;
      --tg-hover:     #bbf7d0;
      --active-bg:    #dcfce7;
      --spinner-track:#cbd5e1;
      --spinner-head: #2563eb;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 24px 16px;
      transition: background 0.2s, color 0.2s;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 1.2em;
    }

    #sync-status {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .countdown-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .countdown-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
    }

    #sync-countdown {
      font-size: 2.6rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, "SF Mono", "Fira Code", monospace;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1;
      min-width: 5ch;
      text-align: center;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-group {
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    button {
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-radius: 7px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    button:hover { background: var(--bg-input-hover); color: var(--text); }
    button:disabled { opacity: 0.4; cursor: default; }

    .btn-group-icon button {
      padding: 6px 9px;
      font-size: 0.9rem;
    }

    #btn-test-tg:hover {
      background: var(--tg-hover);
      color: var(--tg-fg);
    }


    .grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s, background 0.2s;
    }
    .card:hover { border-color: var(--border-hover); }

    .card.expired {
      opacity: 0.45;
      filter: grayscale(0.6);
    }

    body.hide-expired .card.expired { display: none; }

    #btn-toggle-expired.active {
      background: var(--tg-hover);
      color: var(--tg-fg);
    }

    #btn-toggle-new.active {
      background: #1e2a3a;
      color: #93c5fd;
    }
    body.light #btn-toggle-new.active {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .badge-new { background: #1e3a5f; color: #93c5fd; }
    body.light .badge-new { background: #dbeafe; color: #1d4ed8; }

    .posted-ago { color: var(--text-faint); font-style: italic; }
    .expires-label { color: #f97316; }
    body.light .expires-label { color: #ea580c; }

    .card.fading-out {
      transition: opacity 0.8s, transform 0.8s;
      opacity: 0;
      transform: scale(0.97);
      pointer-events: none;
    }

    .card.source-new {
      border-left: 3px solid #3b82f6;
    }

    .card.new-this-sync {
      background: #162b1e !important;
      border-color: #22c55e !important;
      box-shadow: 0 0 0 1px #22c55e33, 0 4px 16px #22c55e18;
    }
    body.light .card.new-this-sync {
      background: #edfcf2 !important;
      border-color: #22c55e !important;
      box-shadow: 0 0 0 1px #22c55e44, 0 4px 16px #22c55e22;
    }

    body.showing-new .card.source-preisfehler {
      border: 1.5px solid #f97316;
      box-shadow: 0 0 0 1px #f9731622, 0 4px 20px #f9731618;
      background: linear-gradient(135deg, #1a1f2e 80%, #2a1a0e 100%);
    }
    body.showing-new.light .card.source-preisfehler {
      border: 1.5px solid #ea580c;
      box-shadow: 0 0 0 1px #ea580c22, 0 4px 20px #ea580c18;
      background: linear-gradient(135deg, #ffffff 80%, #fff7ed 100%);
    }

    .btn-expire {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-faint);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
      line-height: 1;
    }
    .card { position: relative; }
    .card:hover .btn-expire { opacity: 1; }
    .btn-expire:hover { background: #7c2d1233; color: #fca5a5; opacity: 1; }
    body.light .btn-expire:hover { background: #fee2e2; color: #991b1b; }

    .preisfehler-label {
      display: none;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #f97316;
      margin-bottom: 2px;
    }
    body.showing-new .card.source-preisfehler .preisfehler-label { display: block; }
    body.showing-new.light .card.source-preisfehler .preisfehler-label { color: #ea580c; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .title {
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.35;
      flex: 1;
      overflow: hidden;
    }
    .title a {
      color: var(--text);
      text-decoration: none;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .title a:hover { color: var(--link-hover); }

    .badge {
      font-size: 0.68rem;
      font-weight: 700;
      border-radius: 5px;
      padding: 2px 7px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-hot { background: #7c2d12; color: #fca5a5; }
    .badge-expired { background: #374151; color: #9ca3af; }
    .badge-active { background: #14532d; color: #86efac; }
    body.light .badge-hot    { background: #fee2e2; color: #991b1b; }
    body.light .badge-expired{ background: #e2e8f0; color: #64748b; }
    body.light .badge-active { background: #dcfce7; color: #15803d; }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .price-current {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--price);
    }
    .price-orig {
      font-size: 0.85rem;
      color: var(--text-faint);
      text-decoration: line-through;
    }
    .discount {
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--discount-bg);
      color: var(--discount-fg);
      border-radius: 5px;
      padding: 2px 7px;
    }

    .meta {
      font-size: 0.76rem;
      color: var(--text-faint);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meta span { display: flex; align-items: center; gap: 3px; }

    .shop-link {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--border);
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.15s;
    }
    .shop-link:hover { background: var(--spinner-head); color: #0f172a; }
    .hot-bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.74rem;
      color: var(--text-faint);
    }
    .hot-bar-bg {
      flex: 1;
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .hot-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f97316, #ef4444);
      border-radius: 3px;
      transition: width 0.4s;
    }

    #loading, #error-msg {
      max-width: 1100px;
      margin: 60px auto;
      text-align: center;
      color: var(--text-faint);
      font-size: 0.9rem;
    }
    #error-msg { color: #f87171; display: none; }

    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid var(--spinner-track);
      border-top-color: var(--spinner-head);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    #log-panel {
      max-width: 1100px;
      margin: 0 auto 24px;
    }
    .log-inner {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }
    .log-header button {
      background: none;
      border: none;
      color: var(--text-faint);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 5px;
    }
    .log-header button:hover { background: var(--bg-input); color: var(--text); }
    #log-table-wrap { overflow-x: auto; }
    .log-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    .log-table th {
      text-align: left;
      padding: 8px 16px;
      color: var(--text-faint);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .log-table td {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      white-space: nowrap;
    }
    .log-table tr:last-child td { border-bottom: none; }
    .log-table tr:hover td { background: var(--bg-input); }
    .log-num-pos { color: #34d399; font-weight: 600; }
    .log-zero { color: var(--text-faint); }
    .log-error { color: #f87171; }

    #settings-panel { max-width: 1100px; margin: 0 auto 24px; }
    .settings-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
    .settings-hint { font-size: 0.78rem; color: var(--text-faint); margin: 0; }
    .kw-add-row { display: flex; gap: 8px; }
    .kw-add-row input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.82rem;
      color: var(--text);
      outline: none;
    }
    .kw-add-row input:focus { border-color: var(--spinner-head); }
    .kw-add-row button {
      background: var(--spinner-head);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .kw-add-row button:hover { opacity: 0.85; }
    #kw-list { display: flex; flex-direction: column; gap: 6px; }
    .kw-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .kw-item .kw-text { flex: 1; font-size: 0.84rem; font-weight: 500; }
    .kw-item .kw-text.inactive { opacity: 0.4; text-decoration: line-through; }
    .kw-toggle {
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-input-hover);
      color: var(--text-muted);
    }
    .kw-toggle.on { background: #14532d; border-color: #22c55e; color: #86efac; }
    body.light .kw-toggle.on { background: #dcfce7; border-color: #22c55e; color: #15803d; }
    .kw-del { background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 0.85rem; padding: 2px 6px; border-radius: 4px; }
    .kw-del:hover { background: #7c2d1233; color: #fca5a5; }
.keyword-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      background: #3b1f6a;
      color: #c4b5fd;
      white-space: nowrap;
    }
    body.light .keyword-badge { background: #ede9fe; color: #6d28d9; }
    .card.keyword-match {
      border-color: #7c3aed !important;
      box-shadow: 0 0 0 1px #7c3aed33, 0 4px 16px #7c3aed18;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Mydealz Dashboard</h1>
    <div class="header-meta">
      <span id="sync-status">Lädt…</span>
    </div>
  </div>
  <div class="countdown-block">
    <div class="countdown-label">nächster Sync</div>
    <div id="sync-countdown">–:––</div>
  </div>
  <div class="header-right">
    <div class="btn-group">
      <button id="btn-toggle-new" title="Neue Deals anzeigen">🆕 Neue Deals</button>
      <button id="btn-toggle-expired" title="Abgelaufene aus-/einblenden">🙈 Abgelaufene</button>
    </div>
    <div class="btn-group btn-group-icon">
      <button id="btn-sync" title="Jetzt syncen">🔄</button>
      <button id="btn-log" title="Sync-Log anzeigen">📋</button>
      <button id="btn-settings" title="Einstellungen">⚙️</button>
      <button id="btn-theme" title="Theme wechseln">☀️</button>
      <button id="btn-test-tg" title="Telegram testen">📨</button>
    </div>
  </div>
</header>

<div id="log-panel" style="display:none">
  <div class="log-inner">
    <div class="log-header">
      <span>Sync-Log</span>
      <button id="btn-log-close">✕</button>
    </div>
    <div id="log-table-wrap"></div>
  </div>
</div>

<div id="settings-panel" style="display:none">
  <div class="log-inner">
    <div class="log-header">
      <span>⚙️ Keyword-Benachrichtigungen</span>
      <button id="btn-settings-close">✕</button>
    </div>
    <div class="settings-body">
      <p class="settings-hint">Deals die eines dieser Wörter im Titel enthalten werden per Telegram benachrichtigt und farbig hervorgehoben.</p>
      <div class="kw-add-row">
        <input id="kw-input" type="text" placeholder="Keyword eingeben…" autocomplete="off">
        <button id="btn-kw-add">Hinzufügen</button>
      </div>
      <div id="kw-list"></div>
    </div>
  </div>
</div>

<div id="loading"><span class="spinner"></span>Deals werden geladen…</div>
<div id="error-msg">Fehler beim Laden der Deals.</div>
<div class="grid" id="grid" style="display:none"></div>

<script>
  const grid = document.getElementById('grid');
  const loading = document.getElementById('loading');
  const errorMsg = document.getElementById('error-msg');
  const syncStatus = document.getElementById('sync-status');
  const syncCountdown = document.getElementById('sync-countdown');
  const btnSync = document.getElementById('btn-sync');

  let nextSyncTime = null;
  let fastPolling = false;

  function startCountdown() {
    clearInterval(startCountdown._timer);
    startCountdown._timer = setInterval(() => {
      if (!nextSyncTime) { syncCountdown.textContent = '–:––'; return; }
      const secs = Math.round((nextSyncTime - Date.now()) / 1000);
      if (secs <= 0) {
        syncCountdown.textContent = '⏳';
        if (!fastPolling) {
          fastPolling = true;
          const poll = setInterval(async () => {
            await loadSyncStatus();
            const res = await fetch('/api/sync/status');
            const s = await res.json();
            if (!s.is_running && s.next_sync && new Date(s.next_sync).getTime() > Date.now()) {
              clearInterval(poll);
              fastPolling = false;
              await loadDeals();
            }
          }, 2000);
        }
        return;
      }
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      syncCountdown.textContent = `${m}:${String(s).padStart(2,'0')}`;
    }, 1000);
  }
  startCountdown();

  let showNewDeals = true;

  async function loadDeals() {
    try {
      const url = showNewDeals ? '/api/deals?include_new=1' : '/api/deals';
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const deals = await res.json();
      renderDeals(deals);
    } catch (e) {
      loading.style.display = 'none';
      errorMsg.style.display = 'block';
    }
  }

  function renderDeals(deals) {
    loading.style.display = 'none';
    if (!deals.length) {
      grid.innerHTML = '<p style="color:#64748b;grid-column:1/-1;text-align:center">Keine Deals gefunden.</p>';
      grid.style.display = 'grid';
      return;
    }
    grid.innerHTML = deals.map(d => {
      const expired = d.is_expired;
      const hot = d.is_hot;
      const isNew = d.source === 'new';
      const badge = expired
        ? '<span class="badge badge-expired">Abgelaufen</span>'
        : d.is_new_this_sync
          ? '<span class="badge badge-new">🆕 Neu</span>'
          : hot
            ? '<span class="badge badge-hot">🔥 Hot</span>'
            : '<span class="badge badge-active">Aktiv</span>';

      const origPrice = d.next_best_fmt
        ? `<span class="price-orig">${d.next_best_fmt}</span>` : '';
      const disc = d.discount_pct
        ? `<span class="discount">-${d.discount_pct}%</span>` : '';

      const barWidth = d.hot_bar_width || 0;
      const expiresAt = isNew && d.published_at
        ? d.published_at * 1000 + 600000
        : null;

      return `
        <div class="card${expired ? ' expired' : ''}${isNew ? ' source-new' : ' source-preisfehler'}${d.is_new_this_sync ? ' new-this-sync' : ''}${d.keyword_match ? ' keyword-match' : ''}"${expiresAt ? ` data-expires="${expiresAt}"` : ''}>
          <div class="preisfehler-label">🚨 Preisfehler</div>
          ${d.keyword_match ? `<span class="keyword-badge">🔍 ${esc(d.keyword_match)}</span>` : ''}
          ${!isNew && !expired ? `<button class="btn-expire" title="Als abgelaufen markieren" data-id="${d.thread_id}">✕</button>` : ''}
          <div class="card-top">
            <div class="title"><a href="${d.url}" target="_blank" rel="noopener">${esc(d.title)}</a></div>
            ${badge}
          </div>
          <div class="price-row">
            <span class="price-current">${d.price_fmt}</span>
            ${origPrice}${disc}
          </div>
          <div class="meta">
            <span>🏪 ${esc(d.merchant)}</span>
            <span>📂 ${esc(d.category || '–')}</span>
            <span>📅 ${d.published_fmt}</span>
            ${d.published_at ? `<span class="posted-ago" data-published="${d.published_at}"></span>` : ''}
            ${expiresAt ? `<span class="expires-label">⏳ <span class="expires-countdown"></span></span>` : ''}
          </div>
          ${d.link_host ? `<a class="shop-link" href="${d.shop_url}" target="_blank" rel="noopener">🛒 ${esc(d.link_host)}</a>` : ''}
          <div class="hot-bar-wrap">
            🌡 ${Math.round(d.temperature || 0)}°
            <div class="hot-bar-bg"><div class="hot-bar-fill" style="width:${barWidth}%"></div></div>
          </div>
        </div>`;
    }).join('');
    grid.style.display = 'grid';
    loadSyncStatus();
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function loadSyncStatus() {
    try {
      const res = await fetch('/api/sync/status');
      const s = await res.json();
      if (!s.last_sync) { syncStatus.textContent = 'Noch nicht synchronisiert'; return; }
      const ts = new Date(s.last_sync + 'Z').toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
      if (s.is_running) {
        syncStatus.textContent = '⏳ Läuft…';
      } else {
        const visible = Array.from(grid.querySelectorAll('.card:not(.fading-out)'))
          .filter(c => getComputedStyle(c).display !== 'none').length;
        syncStatus.textContent = `✓ ${ts} · ${visible} sichtbar`;
      }
      nextSyncTime = s.next_sync ? new Date(s.next_sync).getTime() : null;
    } catch {}
  }

  btnSync.addEventListener('click', async () => {
    btnSync.disabled = true;
    btnSync.textContent = '⏳ Läuft…';
    await fetch('/api/sync', { method: 'POST' });
    // Poll until sync done
    const poll = setInterval(async () => {
      await loadSyncStatus();
      const res = await fetch('/api/sync/status');
      const s = await res.json();
      if (!s.is_running) {
        clearInterval(poll);
        btnSync.disabled = false;
        btnSync.textContent = '🔄 Jetzt syncen';
        await loadDeals();
      }
    }, 1500);
  });

  document.getElementById('btn-test-tg').addEventListener('click', async () => {
    const btn = document.getElementById('btn-test-tg');
    btn.disabled = true;
    btn.textContent = '⏳ Sende…';
    try {
      const res = await fetch('/api/telegram/test', { method: 'POST' });
      const j = await res.json();
      btn.textContent = j.ok ? '✅ Gesendet!' : `❌ ${j.message}`;
    } catch {
      btn.textContent = '❌ Fehler';
    }
    setTimeout(() => { btn.disabled = false; btn.textContent = '📨 Telegram testen'; }, 3000);
  });

  // Sync log
  const logPanel = document.getElementById('log-panel');
  const logTableWrap = document.getElementById('log-table-wrap');

  async function loadLog() {
    try {
      const res = await fetch('/api/sync/log');
      const rows = await res.json();
      if (!rows.length) {
        logTableWrap.innerHTML = '<p style="padding:16px;color:var(--text-faint)">Noch keine Syncs aufgezeichnet.</p>';
        return;
      }
      logTableWrap.innerHTML = `
        <table class="log-table">
          <thead><tr>
            <th>Zeit</th>
            <th>Neue Preisfehler</th>
            <th>Neue Deals</th>
            <th>Status</th>
          </tr></thead>
          <tbody>${rows.map(r => {
            const t = new Date(r.synced_at + 'Z').toLocaleString('de-DE', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
            const err = r.message && r.message !== '' && !r.message.startsWith('OK');
            const pfNew = r.preisfehler_new;
            const ndNew = r.new_deals_new;
            return `<tr>
              <td>${t}</td>
              <td class="${pfNew > 0 ? 'log-num-pos' : 'log-zero'}">${pfNew > 0 ? '+' + pfNew : '–'}</td>
              <td class="${ndNew > 0 ? 'log-num-pos' : 'log-zero'}">${ndNew > 0 ? '+' + ndNew : '–'}</td>
              <td class="${err ? 'log-error' : ''}">${err ? '❌ ' + esc(r.message) : '✓'}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>`;
    } catch {
      logTableWrap.innerHTML = '<p style="padding:16px;color:#f87171">Fehler beim Laden.</p>';
    }
  }

  document.getElementById('btn-log').addEventListener('click', async () => {
    const open = logPanel.style.display !== 'none';
    logPanel.style.display = open ? 'none' : 'block';
    if (!open) await loadLog();
  });
  document.getElementById('btn-log-close').addEventListener('click', () => {
    logPanel.style.display = 'none';
  });

  // Settings / Keywords
  const settingsPanel = document.getElementById('settings-panel');
  const kwList = document.getElementById('kw-list');
  const kwInput = document.getElementById('kw-input');

  async function loadKeywords() {
    const res = await fetch('/api/keywords');
    const kws = await res.json();
    if (!kws.length) {
      kwList.innerHTML = '<p style="font-size:0.78rem;color:var(--text-faint)">Noch keine Keywords konfiguriert.</p>';
      return;
    }
    kwList.innerHTML = kws.map(k => `
      <div class="kw-item" data-id="${k.id}">
        <span class="kw-text${k.active ? '' : ' inactive'}">${esc(k.keyword)}</span>
        <button class="kw-toggle${k.active ? ' on' : ''}" data-id="${k.id}">${k.active ? 'Aktiv' : 'Inaktiv'}</button>
        <button class="kw-del" data-id="${k.id}" title="Löschen">✕</button>
      </div>`).join('');
  }

  document.getElementById('btn-settings').addEventListener('click', async () => {
    const open = settingsPanel.style.display !== 'none';
    settingsPanel.style.display = open ? 'none' : 'block';
    if (!open) await loadKeywords();
  });
  document.getElementById('btn-settings-close').addEventListener('click', () => {
    settingsPanel.style.display = 'none';
  });

  document.getElementById('btn-kw-add').addEventListener('click', async () => {
    const kw = kwInput.value.trim();
    if (!kw) return;
    await fetch('/api/keywords', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({keyword: kw}) });
    kwInput.value = '';
    await loadKeywords();
  });
  kwInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-kw-add').click(); });

  kwList.addEventListener('click', async e => {
    const id = e.target.dataset.id;
    if (!id) return;
    if (e.target.classList.contains('kw-del')) {
      await fetch(`/api/keywords/${id}`, { method: 'DELETE' });
      await loadKeywords();
    } else if (e.target.classList.contains('kw-toggle')) {
      await fetch(`/api/keywords/${id}/toggle`, { method: 'POST' });
      await loadKeywords();
    }
  });

  // New deals toggle
  const btnToggleNew = document.getElementById('btn-toggle-new');

  function applyNewDealsToggle() {
    btnToggleNew.classList.toggle('active', showNewDeals);
    document.body.classList.toggle('showing-new', showNewDeals);
    btnToggleNew.textContent = showNewDeals ? '🆕 Neue ausblenden' : '🆕 Neue Deals anzeigen';
  }

  btnToggleNew.addEventListener('click', async () => {
    showNewDeals = !showNewDeals;
    localStorage.setItem('showNewDeals', showNewDeals);
    applyNewDealsToggle();
    await loadDeals();
  });

  applyNewDealsToggle();

  // Manual expire buttons
  document.addEventListener('click', async e => {
    const btn = e.target.closest('.btn-expire');
    if (!btn) return;
    const threadId = btn.dataset.id;
    await fetch(`/api/deals/${threadId}/expire`, {method: 'POST'});
    const card = btn.closest('.card');
    card.classList.add('expired');
    btn.remove();
  });

  function fmtAgo(secs) {
    if (secs < 60) return `vor ${secs} Sek`;
    if (secs < 3600) return `vor ${Math.floor(secs / 60)} Min`;
    return `vor ${Math.floor(secs / 3600)} Std`;
  }

  // Per-card expiry countdown + posted-ago timer
  setInterval(() => {
    const now = Date.now();
    document.querySelectorAll('.posted-ago[data-published]').forEach(el => {
      const secs = Math.round((now - parseInt(el.dataset.published) * 1000) / 1000);
      el.textContent = '🕐 ' + fmtAgo(secs);
    });
    document.querySelectorAll('.card[data-expires]').forEach(card => {
      const exp = parseInt(card.dataset.expires);
      const secs = Math.round((exp - now) / 1000);
      const label = card.querySelector('.expires-countdown');
      if (secs <= 0) {
        if (!card.classList.contains('fading-out')) {
          card.classList.add('fading-out');
          setTimeout(() => card.remove(), 800);
        }
      } else if (label) {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        label.textContent = `verschwindet in ${m}:${String(s).padStart(2, '0')}`;
      }
    });
  }, 1000);

  // Theme toggle
  const btnTheme = document.getElementById('btn-theme');
  let isLight = localStorage.getItem('theme') === 'light';

  function applyTheme() {
    document.body.classList.toggle('light', isLight);
    btnTheme.textContent = isLight ? '🌙 Dunkel' : '☀️ Hell';
  }

  btnTheme.addEventListener('click', () => {
    isLight = !isLight;
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    applyTheme();
  });

  applyTheme();

  // Hide expired toggle
  const btnToggle = document.getElementById('btn-toggle-expired');
  let hideExpired = true;

  function applyToggle() {
    document.body.classList.toggle('hide-expired', hideExpired);
    btnToggle.classList.toggle('active', hideExpired);
    btnToggle.textContent = hideExpired ? '👁 Abgelaufene anzeigen' : '🙈 Abgelaufene ausblenden';
  }

  btnToggle.addEventListener('click', () => {
    hideExpired = !hideExpired;
    localStorage.setItem('hideExpired', hideExpired);
    applyToggle();
  });

  applyToggle();


  loadDeals();
  loadSyncStatus();
  setInterval(loadSyncStatus, 30000);
</script>

</body>
</html>
